name: uk-bus-fare-cap-platform

services:
  postgres:
    image: postgres:16
    container_name: bfc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bus_fare_cap}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: bfc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_locally}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the bronze/silver buckets automatically on first startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-change_me_locally};
      mc mb -p local/${MINIO_BUCKET_BRONZE:-bronze};
      mc mb -p local/${MINIO_BUCKET_SILVER:-silver};
      exit 0;
      "

  # ---------------------------------------------------------------------
  # Airflow (Week 4 of the roadmap). Uncomment once your DAGs are ready.
  # For a full multi-service Airflow stack (scheduler, webserver, triggerer),
  # start from the official compose file and point it at ../airflow/dags:
  # https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html
  # A minimal single-container option for local development:
  #
  # airflow:
  #   image: apache/airflow:2.9.0
  #   container_name: bfc-airflow
  #   restart: unless-stopped
  #   depends_on:
  #     - postgres
  #   environment:
  #     AIRFLOW__CORE__EXECUTOR: LocalExecutor
  #     AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_locally}@postgres/airflow
  #     AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  #   volumes:
  #     - ../airflow/dags:/opt/airflow/dags
  #   ports:
  #     - "8080:8080"
  #   command: standalone
  # ---------------------------------------------------------------------

volumes:
  pgdata:
  minio-data:
