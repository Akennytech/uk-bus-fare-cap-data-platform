name: uk-bus-fare-cap-platform

services:
  postgres:
    image: postgres:16
    container_name: bfc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bus_fare_cap}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: bfc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_locally}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-change_me_locally};
      mc mb -p local/${MINIO_BUCKET_BRONZE:-bronze};
      mc mb -p local/${MINIO_BUCKET_SILVER:-silver};
      exit 0;
      "

  # ---------------------------------------------------------------------
  # Airflow (Week 4 of the roadmap) — single "standalone" container:
  # webserver + scheduler + a freshly-created admin user, all in one process.
  # Fine for local/portfolio use; not how you'd run this in production.
  # ---------------------------------------------------------------------
  airflow:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    container_name: bfc-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_locally}@postgres/airflow
      # Same variable names your scripts already read from .env — but inside
      # this container, Postgres/MinIO are reachable by service name, not
      # "localhost". python-dotenv's load_dotenv() won't override values
      # already set in the real environment, so these two win over .env.
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ..:/opt/airflow/project
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: standalone

volumes:
  pgdata:
  minio-data:
  airflow-logs:
