version: 2
sources:
  - name: silver
    description: "Silver-layer tables loaded from MinIO CSV into Postgres for dbt to build on."
    schema: silver
    tables:
      - name: naptan_stops
        description: "Cleaned, deduplicated NaPTAN bus stop reference data."
        columns:
          - name: atco_code
            description: "Unique national stop identifier."
            tests:
              - unique
              - not_null
      - name: bods_services
        description: "Cleaned BODS TransXChange timetable summary: scheduled trips per operator/line/day-pattern (East Midlands region)."
      - name: ons_population
        description: "ONS mid-2024 population estimates for the project's 6 target local authorities."
        columns:
          - name: la_code
            tests:
              - unique
              - not_null
      - name: imd_la_summary
        description: "English Indices of Deprivation 2019, aggregated from LSOA to local authority district level (25 districts)."
        columns:
          - name: la_code
            tests:
              - unique
              - not_null
      - name: weather_daily
        description: "Open-Meteo daily historical weather for Derby, Leicester, Nottingham."
      - name: fuel_prices_weekly
        description: "DfT weekly national road fuel price series, 2018-present."
        columns:
          - name: week_start_date
            tests:
              - unique
              - not_null
