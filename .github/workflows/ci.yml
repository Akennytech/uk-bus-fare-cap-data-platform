name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff black
      - name: Ruff (real-bug rules - unused imports, undefined names, syntax errors)
        run: ruff check .
      - name: Black format check (informational only for now)
        run: black --check . || echo "::warning::Code isn't fully Black-formatted yet - run 'black .' locally to normalize it"
        continue-on-error: true

  dag-validate:
    name: Airflow DAG import check
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow_home
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////tmp/airflow_home/airflow.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Airflow (pinned to match the project's Docker image)
        run: |
          pip install "apache-airflow==2.9.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.0/constraints-3.11.txt"
      - name: Initialize Airflow metadata DB
        run: airflow db migrate
      - name: Load DAGs and fail on any import error
        run: |
          python -c "
          from airflow.models import DagBag
          bag = DagBag(dag_folder='airflow/dags', include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f'::error file={path}::{err}')
              raise SystemExit(f'{len(bag.import_errors)} DAG(s) failed to import')
          print(f'OK - loaded {len(bag.dags)} DAG(s) with no import errors: {list(bag.dags)}')
          "

  compose-validate:
    name: docker-compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker/docker-compose.yml config -q

  docker-build:
    name: Airflow image build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build airflow image (with layer caching)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/airflow.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
